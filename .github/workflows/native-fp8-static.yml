name: Native cached-scale exact source verification
on:
  push:
    branches: [checks/pr64288-asm-static-20261104]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
      - name: Verify native files match the completed static checks
        run: |
          uv venv --python 3.12
          .venv/bin/python tools/native_cache_scale_exact.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-cache-scale-exact-source
          path: native-cache-scale-exact.json
