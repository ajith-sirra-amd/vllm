name: Native FP8 MLA static checks
on:
  push:
    branches:
      - checks/fp8-mla-native-20261028
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
      - name: Prepare Python
        run: |
          uv venv --python 3.12
          uv pip install ruff==0.14.0 pyyaml
      - name: Format and check native patch
        run: .venv/bin/python tools/native_fp8_static_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fp8-static
          path: |
            native-static-results.json
            native-static-files.zip
