name: Native FP8 checks on pinned upstream main
on:
  push:
    branches: [checks/pr64288-integrate-static-20261105]
    paths: [.github/workflows/native-fp8-static.yml]
permissions:
  contents: read
jobs:
  rendered-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      READTHEDOCS_CANONICAL_URL: https://docs.vllm.ai/en/latest/
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 54f39769d0e17a8f2874695e849c4e6626e71b56
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
      - name: Render native candidate documentation
        run: |
          uv venv --python 3.12
          uv pip install --require-hashes -r requirements/docs.txt
          mkdir -p review-docs-evidence
          git rev-parse HEAD > review-docs-evidence/source-sha.txt
          set -o pipefail
          .venv/bin/python -m mkdocs build --strict --site-dir review-docs-site 2>&1 | tee review-docs-evidence/build.log
      - name: Verify generated feature documentation
        run: |
          .venv/bin/python - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  self.parts.append(data)
          page = Path("review-docs-site/configuration/env_vars/index.html")
          parser = Text()
          parser.feed(page.read_text())
          text = " ".join(parser.parts)
          flag = "VLLM_ROCM_USE_AITER_FLYDSL_FP8_PREFILL_ATTN"
          assert flag in text
          start = text.find(flag)
          evidence = {"source": Path("review-docs-evidence/source-sha.txt").read_text().strip(),
                      "page": str(page), "excerpt": text[max(0, start-300):start+6500]}
          Path("review-docs-evidence/rendered-excerpt.json").write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence))
          PY
      - name: Upload rendered documentation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fp8-rendered-docs
          path: |
            review-docs-evidence/
            review-docs-site/configuration/env_vars/
            review-docs-site/search/search_index.json
          if-no-files-found: error

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 54f39769d0e17a8f2874695e849c4e6626e71b56
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.6"
      - name: Check candidate against pinned main
        run: |
          uv venv --python 3.12
          uv pip install -r requirements/lint.txt
          .venv/bin/pre-commit install
          mkdir -p review-static-evidence
          git rev-parse HEAD > review-static-evidence/source-sha.txt
          git diff --name-only ee85faa1280c3f9ef877c7b17d1a3ef113133e57 HEAD > review-static-evidence/changed-files.txt
          mapfile -t changed < review-static-evidence/changed-files.txt
          set -o pipefail
          .venv/bin/pre-commit run --files "${changed[@]}" 2>&1 | tee review-static-evidence/pre-commit.log
          git diff --exit-code
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fp8-pinned-main-static
          path: review-static-evidence/
          if-no-files-found: error
